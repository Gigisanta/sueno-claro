name: SleepLike quality and SEO
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: sleeplike-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test && npm run build && npm run typecheck
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
        env:
          CI: "true"
